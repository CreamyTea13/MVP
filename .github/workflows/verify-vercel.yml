name: Verify Vercel Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-vercel.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose stable and generated Vercel URLs
        shell: bash
        run: |
          set -u
          for BASE in \
            "https://everyday-engine-tylerkapp13-5747.vercel.app" \
            "https://everyday-engine-6lladp78u-tylerkapp13-5747.vercel.app"
          do
            echo "=== $BASE ==="
            for path in "/" "/tools/unit-price-compare/" "/robots.txt" "/sitemap.xml"
            do
              out="/tmp/ee-body"
              headers="/tmp/ee-headers"
              code=$(curl -L -sS -D "$headers" -o "$out" -w "%{http_code}" "$BASE$path" || true)
              echo "$path -> HTTP $code"
              grep -iE '^(server|x-vercel|content-type|location):' "$headers" || true
              printf 'body: '
              head -c 300 "$out" | tr '\n' ' ' || true
              echo
            done
          done
