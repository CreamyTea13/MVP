name: Verify Everyday Engine Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-vercel.yml
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production host and staged hot mirror
        shell: bash
        run: |
          set -euo pipefail
          PRIMARY="https://everyday-engine-tylerkapp13-5747.vercel.app"
          MIRROR="https://everyday-engine-rqlvuu.v2.appdeploy.ai"
          INDEXNOW_KEY="bb07bc1aac3124e31ea838541931a21b"
          HTML_PATHS=(
            "/"
            "/tools/unit-price-compare/"
            "/tools/overtime-pay/"
            "/affiliate-disclosure.html"
          )
          STATIC_PATHS=(
            "/assets/app.js"
            "/assets/monetization.json"
            "/robots.txt"
            "/sitemap.xml"
          )

          key_for() { printf '%s' "$1" | tr '/.' '__'; }

          fetch_200() {
            local base="$1" path="$2" out="$3" code=""
            for attempt in {1..12}; do
              code=$(curl -L -sS -o "$out" -w "%{http_code}" "$base$path" || true)
              if [ "$code" = "200" ]; then
                echo "$base$path -> HTTP 200"
                return 0
              fi
              echo "$base$path -> HTTP $code (attempt $attempt/12)"
              sleep 10
            done
            return 1
          }

          fetch_pair() {
            local path="$1" key
            key=$(key_for "$path")
            fetch_200 "$PRIMARY" "$path" "/tmp/ee-primary/$key"
            fetch_200 "$MIRROR" "$path" "/tmp/ee-mirror/$key"
          }

          assert_both() {
            local path="$1" text="$2" key
            key=$(key_for "$path")
            grep -Fq "$text" "/tmp/ee-primary/$key"
            grep -Fq "$text" "/tmp/ee-mirror/$key"
          }

          mkdir -p /tmp/ee-primary /tmp/ee-mirror
          for path in "${HTML_PATHS[@]}" "${STATIC_PATHS[@]}"; do fetch_pair "$path"; done

          assert_both "/" "Everyday Engine"
          assert_both "/" "Unit Price Compare"
          assert_both "/" "Resale Profit Calculator"
          assert_both "/tools/unit-price-compare/" "Unit Price Compare"
          assert_both "/tools/overtime-pay/" "Overtime Pay Calculator"
          assert_both "/affiliate-disclosure.html" "Affiliate Disclosure"
          assert_both "/assets/app.js" "Share result"
          assert_both "/assets/monetization.json" '"enabled": false'
          assert_both "/assets/monetization.json" '"plusUrl": ""'
          assert_both "/robots.txt" "User-agent: *"
          assert_both "/sitemap.xml" "/tools/unit-price-compare/"
          assert_both "/sitemap.xml" "/tools/resale-profit/"

          for path in "${STATIC_PATHS[@]}"; do
            key=$(key_for "$path")
            cmp -s "/tmp/ee-primary/$key" "/tmp/ee-mirror/$key" || {
              echo "Static asset mismatch between Vercel and AppDeploy at $path"
              exit 1
            }
          done

          canonical='rel="canonical" href="https://everyday-engine-tylerkapp13-5747.vercel.app/'
          for path in "${HTML_PATHS[@]}"; do
            key=$(key_for "$path")
            grep -Fq "$canonical" "/tmp/ee-mirror/$key" || { echo "Mirror lost Vercel canonical authority at $path"; exit 1; }
          done

          unit_key=$(key_for "/tools/unit-price-compare/")
          grep -Fq "How to make the decision" "/tmp/ee-mirror/$unit_key"
          grep -Fq "BreadcrumbList" "/tmp/ee-mirror/$unit_key"

          mirror_key="/tmp/ee-mirror/indexnow-key"
          fetch_200 "$MIRROR" "/$INDEXNOW_KEY.txt" "$mirror_key"
          [ "$(tr -d '\r\n' < "$mirror_key")" = "$INDEXNOW_KEY" ]

          primary_key="/tmp/ee-primary/indexnow-key"
          primary_code=$(curl -L -sS -o "$primary_key" -w "%{http_code}" "$PRIMARY/$INDEXNOW_KEY.txt" || true)
          if [ "$primary_code" = "200" ]; then
            [ "$(tr -d '\r\n' < "$primary_key")" = "$INDEXNOW_KEY" ]
            echo "IndexNow key is live on canonical production."
          elif [ "$primary_code" = "404" ]; then
            echo "IndexNow remains deferred until Vercel manually promotes the staged production build."
          else
            echo "Unexpected canonical IndexNow key status: HTTP $primary_code"
            exit 1
          fi

          echo "Vercel canonical production is healthy; AppDeploy v4.2 staging is healthy."
          echo "Everyday Engine production verification passed."
