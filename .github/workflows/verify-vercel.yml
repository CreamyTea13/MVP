name: Verify Vercel Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-vercel.yml
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify portable production build
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://everyday-engine-tylerkapp13-5747.vercel.app"

          fetch_with_retry() {
            local path="$1"
            local out="$2"
            local code=""
            for attempt in {1..12}; do
              code=$(curl -L -sS -o "$out" -w "%{http_code}" "$BASE$path" || true)
              if [ "$code" = "200" ]; then
                echo "$path -> HTTP 200"
                return 0
              fi
              echo "$path -> HTTP $code (attempt $attempt/12)"
              sleep 10
            done
            return 1
          }

          fetch_with_retry "/" /tmp/home
          grep -Fq "Everyday Engine" /tmp/home
          grep -Fq "Unit Price Compare" /tmp/home
          grep -Fq "Resale Profit" /tmp/home
          grep -Fq "Share result" /tmp/home

          fetch_with_retry "/assets/config.js" /tmp/config
          grep -Fq "plusUrl" /tmp/config

          fetch_with_retry "/robots.txt" /tmp/robots
          grep -Fq "User-agent: *" /tmp/robots

          fetch_with_retry "/sitemap.xml" /tmp/sitemap
          grep -Fq "<urlset" /tmp/sitemap

          echo "Everyday Engine portable production smoke test passed."
