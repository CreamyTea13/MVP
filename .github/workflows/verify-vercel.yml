name: Verify Vercel Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-vercel.yml
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify stable production alias
        shell: bash
        run: |
          set -u
          BASE="https://everyday-engine-tylerkapp13-5747.vercel.app"
          failures=0
          check() {
            local path="$1"
            local expect="$2"
            local out="/tmp/ee$(echo "$path" | tr '/.' '__')"
            code=$(curl -L -sS -o "$out" -w "%{http_code}" "$BASE$path")
            echo "$path -> HTTP $code"
            if [ "$code" != "200" ] || ! grep -Fq "$expect" "$out"; then
              echo "  expected content missing: $expect"
              echo "  title: $(grep -io '<title>[^<]*' "$out" | head -1 | sed 's/<title>//I')"
              failures=$((failures+1))
            else
              echo "  contains: $expect"
            fi
          }
          check "/" "Everyday Engine"
          check "/tools/unit-price-compare/" "Unit Price Compare"
          check "/tools/overtime-pay/" "Overtime Pay Calculator"
          check "/robots.txt" "User-agent: *"
          check "/sitemap.xml" "<urlset"
          echo "failures=$failures"
          test "$failures" -eq 0
