name: Verify Vercel Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-vercel.yml
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://everyday-engine-qr305gm2w-tylerkapp13-5747.vercel.app"
          check() {
            local path="$1"
            local expect="$2"
            local out="/tmp/ee$(echo "$path" | tr '/.' '__')"
            code=$(curl -L -sS -o "$out" -w "%{http_code}" "$BASE$path")
            echo "$path -> HTTP $code"
            test "$code" = "200"
            grep -Fq "$expect" "$out"
            echo "  contains: $expect"
          }
          check "/" "Everyday Engine"
          check "/tools/unit-price-compare/" "Unit Price Compare"
          check "/tools/overtime-pay/" "Overtime Pay Calculator"
          check "/robots.txt" "User-agent: *"
          check "/sitemap.xml" "<urlset"
          echo "VERCEL_SMOKE_TEST=PASS"
