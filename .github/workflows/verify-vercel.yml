name: Verify Vercel Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-vercel.yml
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify multi-page production build
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://everyday-engine-tylerkapp13-5747.vercel.app"

          fetch_with_retry() {
            local path="$1"
            local out="$2"
            local code=""
            for attempt in {1..12}; do
              code=$(curl -L -sS -o "$out" -w "%{http_code}" "$BASE$path" || true)
              if [ "$code" = "200" ]; then
                echo "$path -> HTTP 200"
                return 0
              fi
              echo "$path -> HTTP $code (attempt $attempt/12)"
              sleep 10
            done
            return 1
          }

          fetch_with_retry "/" /tmp/home
          grep -Fq "Everyday Engine" /tmp/home
          grep -Fq "Unit Price Compare" /tmp/home
          grep -Fq "Resale Profit Calculator" /tmp/home

          fetch_with_retry "/tools/unit-price-compare/" /tmp/unit
          grep -Fq "Unit Price Compare" /tmp/unit

          fetch_with_retry "/tools/overtime-pay/" /tmp/overtime
          grep -Fq "Overtime Pay Calculator" /tmp/overtime

          fetch_with_retry "/affiliate-disclosure.html" /tmp/disclosure
          grep -Fq "Affiliate Disclosure" /tmp/disclosure

          fetch_with_retry "/assets/app.js" /tmp/app
          grep -Fq "Share result" /tmp/app

          fetch_with_retry "/assets/monetization.json" /tmp/monetization
          grep -Fq '"enabled": false' /tmp/monetization
          grep -Fq '"plusUrl": ""' /tmp/monetization

          fetch_with_retry "/robots.txt" /tmp/robots
          grep -Fq "User-agent: *" /tmp/robots

          fetch_with_retry "/sitemap.xml" /tmp/sitemap
          grep -Fq "<urlset" /tmp/sitemap
          grep -Fq "/tools/unit-price-compare/" /tmp/sitemap
          grep -Fq "/tools/resale-profit/" /tmp/sitemap

          echo "Everyday Engine multi-page production smoke test passed."
