name: Verify Everyday Engine Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-vercel.yml
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production hosts and parity
        shell: bash
        run: |
          set -euo pipefail
          PRIMARY="https://everyday-engine-tylerkapp13-5747.vercel.app"
          MIRROR="https://everyday-engine-rqlvuu.v2.appdeploy.ai"
          PATHS=(
            "/"
            "/tools/unit-price-compare/"
            "/tools/overtime-pay/"
            "/affiliate-disclosure.html"
            "/assets/app.js"
            "/assets/monetization.json"
            "/robots.txt"
            "/sitemap.xml"
          )

          key_for() {
            printf '%s' "$1" | tr '/.' '__'
          }

          fetch_with_retry() {
            local base="$1"
            local path="$2"
            local out="$3"
            local code=""
            for attempt in {1..12}; do
              code=$(curl -L -sS -o "$out" -w "%{http_code}" "$base$path" || true)
              if [ "$code" = "200" ]; then
                echo "$base$path -> HTTP 200"
                return 0
              fi
              echo "$base$path -> HTTP $code (attempt $attempt/12)"
              sleep 10
            done
            return 1
          }

          assert_primary_contains() {
            local path="$1"
            local text="$2"
            local key
            key=$(key_for "$path")
            grep -Fq "$text" "/tmp/ee-primary/$key"
          }

          mkdir -p /tmp/ee-primary /tmp/ee-mirror
          for path in "${PATHS[@]}"; do
            key=$(key_for "$path")
            fetch_with_retry "$PRIMARY" "$path" "/tmp/ee-primary/$key"
            fetch_with_retry "$MIRROR" "$path" "/tmp/ee-mirror/$key"
          done

          assert_primary_contains "/" "Everyday Engine"
          assert_primary_contains "/tools/unit-price-compare/" "Unit Price Compare"
          assert_primary_contains "/tools/overtime-pay/" "Overtime Pay Calculator"
          assert_primary_contains "/affiliate-disclosure.html" "Affiliate Disclosure"
          assert_primary_contains "/assets/app.js" "Share result"
          assert_primary_contains "/assets/monetization.json" '"enabled": false'
          assert_primary_contains "/assets/monetization.json" '"plusUrl": ""'
          assert_primary_contains "/robots.txt" "User-agent: *"
          assert_primary_contains "/sitemap.xml" "/tools/unit-price-compare/"
          assert_primary_contains "/sitemap.xml" "/tools/resale-profit/"

          for path in "${PATHS[@]}"; do
            key=$(key_for "$path")
            if ! cmp -s "/tmp/ee-primary/$key" "/tmp/ee-mirror/$key"; then
              echo "Content mismatch between Vercel and AppDeploy at $path"
              diff -u "/tmp/ee-primary/$key" "/tmp/ee-mirror/$key" | head -80 || true
              exit 1
            fi
            echo "$path -> byte-identical across Vercel and AppDeploy"
          done

          home_key=$(key_for "/")
          grep -Fq 'rel="canonical" href="https://everyday-engine-tylerkapp13-5747.vercel.app/' "/tmp/ee-mirror/$home_key"
          echo "Canonical authority remains on Vercel; AppDeploy is a verified hot mirror."
          echo "Everyday Engine production parity check passed."
